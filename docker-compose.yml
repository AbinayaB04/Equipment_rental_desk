# One-command local stack: PostgreSQL + backend + frontend.
#   docker compose up --build
# Works without a .env file; values below fall back to local-development defaults.
name: equipment-rental-desk

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rental_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rental}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      # Not used by the app until M1; passed now so the wiring is already in place.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rental}:${POSTGRES_PASSWORD:-rental_dev_password}@db:5432/${POSTGRES_DB:-rental}
      CORS_ORIGINS: http://localhost:8081,http://localhost:8080,http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
